name: booking_app
description: Offline excursion booking app for sellers, admins, drivers, and guides.
publish_to: 'none'
version: 0.1.1+7

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  sentry_flutter: ^9.9.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  rxdart: ^0.28.0
  flutter_local_notifications: ^17.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  collection: ^1.18.0
  http: ^1.2.1
  supabase_flutter: ^2.10.3
  pdf: ^3.10.7
  printing: ^5.11.0
  url_launcher: ^6.3.1
  share_plus: ^10.1.2
  path_provider: ^2.1.5
  connectivity_plus: ^6.0.5
  flutter_colorpicker: ^1.0.3
# В pubspec.yaml добавьте:
dependency_overrides:
  web: 1.0.0
dev_dependencies:
  sentry_dart_plugin: ^3.2.0
  flutter_test:
    sdk: flutter
  test: ^1.24.0
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/fonts/

sentry:
  upload_debug_symbols: true
  upload_source_maps: true
  project: flutter_excursion
  org: spbstu-49
